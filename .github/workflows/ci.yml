name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FormFlow.slnx

      - name: Build
        run: dotnet build FormFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FormFlow.slnx --no-build --configuration Release

  react:
    name: React test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            FormFlow.React/package-lock.json
            FormFlow.React.Tests/package-lock.json

      # The test project imports components from FormFlow.React, so both need dependencies.
      - name: Install app dependencies
        working-directory: ./FormFlow.React
        run: npm ci

      - name: Install test dependencies
        working-directory: ./FormFlow.React.Tests
        run: npm ci

      - name: Test
        working-directory: ./FormFlow.React.Tests
        run: npm test

      - name: Build
        working-directory: ./FormFlow.React
        run: npm run build
