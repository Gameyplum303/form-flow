name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  react:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FormFlow.React/package-lock.json

      - name: Install dependencies
        working-directory: ./FormFlow.React
        run: npm ci

      - name: Lint
        working-directory: ./FormFlow.React
        run: npm run lint

  dotnet:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting
        run: dotnet format FormFlow.slnx --verify-no-changes
