# Runs the whole app: docker compose up --build
#   API and Swagger UI  http://localhost:5164/swagger
#   Blazor app          http://localhost:5224 (test sign-in: student / password)
#   React app           http://localhost:3000
# Set FORMFLOW_ADMIN_PASSWORD (the Rogers account), FORMFLOW_STUDENT_PASSWORD and
# FORMFLOW_JWT_KEY (32+ characters) to change the defaults. Accounts are created the first
# time the API sees them, so a new password for an existing account needs a fresh volume
# (docker compose down --volumes). Set FORMFLOW_LOGIN_HINT= to hide the sign-in hint.
services:
  api:
    build:
      context: .
      dockerfile: FormFlow.Backend/Dockerfile
    ports:
      - "5164:8080"
    volumes:
      - formflow-data:/data
    environment:
      AdminAccounts__0__Username: Rogers
      AdminAccounts__0__Password: ${FORMFLOW_ADMIN_PASSWORD:-password}
      AdminAccounts__1__Username: student
      AdminAccounts__1__Password: ${FORMFLOW_STUDENT_PASSWORD:-password}
      Jwt__Key: ${FORMFLOW_JWT_KEY:-}
    healthcheck:
      # The runtime image has no curl, so bash's /dev/tcp does the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/surveys HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 12

  blazor:
    build:
      context: .
      dockerfile: FormFlow.Blazor/Dockerfile
    ports:
      - "5224:8080"
    environment:
      BackendApi__BaseUrl: http://api:8080/
      LoginHint: "${FORMFLOW_LOGIN_HINT-Test account: student / password}"
    depends_on:
      api:
        condition: service_healthy

  react:
    build:
      context: FormFlow.React
      args:
        REACT_APP_API_URL: http://localhost:5164
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  formflow-data:
